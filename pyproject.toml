[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "0.1.0"
description = "Agent that builds evidence-backed profiles of Norwegian companies from permitted public sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["anthropic>=0.120"]
dev = ["pytest>=8"]

[project.scripts]
signalpost = "signalpost.cli:main"

[tool.setuptools.packages.find]
include = ["signalpost*"]
